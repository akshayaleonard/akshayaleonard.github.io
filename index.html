<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akshaya Leonard · MD Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Hanken+Grotesk:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style id="app-style">
/* Bougainvillea & Oak: ivory paper, espresso ink, bougainvillea rose, oak sand.
   Layout idea: an editorial magazine that you walk through year by year, semester by semester. */
:root{
  --paper: oklch(0.968 0.014 78);
  --card: oklch(0.985 0.008 82);
  --ink: oklch(0.23 0.028 42);
  --ink-deep: oklch(0.2 0.025 40);
  --ink-on: oklch(0.95 0.015 78);
  --muted: oklch(0.48 0.03 50);
  --rose: oklch(0.54 0.19 357);
  --rose-deep: oklch(0.4 0.14 358);
  --blush: oklch(0.91 0.045 8);
  --oak: oklch(0.8 0.07 70);
  --sand: oklch(0.9 0.035 72);
  --line: oklch(0.86 0.025 70);
  --font-display: "Instrument Serif", "Times New Roman", serif;
  --font-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --shadow-soft: 0 30px 60px -30px color-mix(in oklab, var(--ink) 35%, transparent);
  --shadow-rose: 0 20px 50px -20px color-mix(in oklab, var(--rose) 55%, transparent);
  color-scheme: light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:var(--rose);color:var(--card)}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:400;letter-spacing:-0.02em;line-height:1.02;margin:0;text-wrap:balance}
p{margin:0}
:focus-visible{outline:2px solid var(--rose);outline-offset:3px;border-radius:4px}
.eyebrow{font-family:var(--font-mono);font-size:.7rem;letter-spacing:.18em;text-transform:uppercase}
.muted{color:var(--muted)}
.rose{color:var(--rose)}
.wrap{max-width:1240px;margin:0 auto;padding:0 clamp(16px,4vw,40px)}
.grain{position:relative}
.grain::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.07;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.arch{border-radius:999px 999px 1.25rem 1.25rem;overflow:hidden}
.link-u{background-image:linear-gradient(currentColor,currentColor);background-size:0% 1px;background-repeat:no-repeat;background-position:0 100%;transition:background-size .5s var(--ease);text-decoration:none}
.link-u:hover{background-size:100% 1px}

/* Header */
.hdr{position:fixed;inset:0 0 auto 0;z-index:50;transition:all .5s var(--ease);padding:20px 0}
.hdr.scrolled{background:color-mix(in oklab,var(--paper) 82%,transparent);backdrop-filter:blur(12px);padding:12px 0}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none}
.brand b{font-family:var(--font-display);font-weight:400;font-style:italic;font-size:1.6rem}
.nav{display:flex;align-items:center;gap:28px}
.nav a{text-decoration:none;color:color-mix(in oklab,var(--ink) 70%,transparent);padding:4px 0}
.nav a:hover{color:var(--ink)}
.nav a.on{color:var(--rose)}
.years-dd{position:relative}
.years-dd>button{background:none;border:0;cursor:pointer;padding:4px 0;color:color-mix(in oklab,var(--ink) 70%,transparent)}
.years-dd>button.on{color:var(--rose)}
.years-menu{position:absolute;top:calc(100% + 12px);left:50%;translate:-50% 0;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-soft);padding:8px;display:grid;grid-template-columns:repeat(2,minmax(150px,1fr));gap:4px;opacity:0;pointer-events:none;transition:opacity .25s,translate .25s;}
.years-dd:hover .years-menu,.years-dd:focus-within .years-menu{opacity:1;pointer-events:auto;translate:-50% 4px}
.years-menu a{padding:10px 12px;border-radius:12px;text-decoration:none;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.years-menu a:hover{background:var(--blush)}
.years-menu a span:first-child{font-family:var(--font-display);font-size:1.25rem}
.pill-ink{background:var(--ink);color:var(--ink-on);border-radius:999px;padding:9px 16px;text-decoration:none;transition:background .4s}
.nav a.pill-ink,.pill-ink{color:var(--ink-on)}
.pill-ink:hover{background:var(--rose);color:var(--ink-on)}
.menu-btn{display:none;background:none;border:0;cursor:pointer}
.mob{position:fixed;inset:0;z-index:49;background:var(--ink);color:var(--ink-on);display:flex;flex-direction:column;justify-content:flex-end;padding:24px 24px 48px;opacity:0;pointer-events:none;transition:opacity .5s}
.mob.open{opacity:1;pointer-events:auto}
.mob a{font-family:var(--font-display);font-style:italic;font-size:2.8rem;line-height:1.1;text-decoration:none}
.mob a:hover{color:var(--rose)}
.mob .yrs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 10px}
.mob .yrs a{font-size:1.4rem;border:1px solid color-mix(in oklab,var(--ink-on) 25%,transparent);border-radius:999px;text-align:center;padding:8px 0;font-style:normal}
@media (max-width:820px){.nav{display:none}.menu-btn{display:block}}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:10px;border-radius:999px;padding:13px 24px;text-decoration:none;cursor:pointer;border:1px solid transparent;font-size:.95rem;transition:all .5s var(--ease);background:none}
.btn svg{width:16px;height:16px}
.btn-rose{background:var(--rose);color:var(--card);box-shadow:var(--shadow-rose)}
.btn-rose:hover{background:var(--rose-deep);transform:translateY(-2px)}
.btn-ink{background:var(--ink);color:var(--ink-on)}
.btn-ink:hover{background:var(--rose)}
.btn-quiet{border-color:color-mix(in oklab,var(--ink) 25%,transparent)}
.btn-quiet:hover{background:var(--ink);color:var(--paper)}
.btn-sm{padding:8px 16px;font-size:.85rem}
.btn[disabled]{opacity:.5;pointer-events:none}

/* Page transitions */
main{min-height:70vh}
.enter>*{animation:rise .9s var(--ease) both}
.enter>*:nth-child(2){animation-delay:.06s}.enter>*:nth-child(3){animation-delay:.12s}.enter>*:nth-child(4){animation-delay:.18s}.enter>*:nth-child(5){animation-delay:.24s}
@keyframes rise{from{opacity:.001;transform:translateY(24px)}to{opacity:1;transform:none}}

/* Hero */
.hero{padding:150px 0 70px;position:relative}
.hero .bloom{position:absolute;inset:0;background:radial-gradient(60% 60% at 75% 30%,color-mix(in oklab,var(--rose) 18%,transparent),transparent 70%);pointer-events:none}
.hero-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:56px;align-items:end;position:relative}
.hero h1{font-size:clamp(3.6rem,10.5vw,9.5rem);line-height:.86}
.hero h1 em{color:var(--rose)}
.hero .lede{font-size:1.2rem;max-width:34ch;margin-top:28px;color:color-mix(in oklab,var(--ink) 82%,transparent)}
.hero .ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}
.hero-photo{position:relative}
.hero-photo .arch{aspect-ratio:4/5;box-shadow:var(--shadow-soft)}
.hero-photo img{width:100%;height:100%;object-fit:cover;object-position:50% 42%}
.badge{position:absolute;left:-56px;bottom:30px;width:132px;height:132px;color:var(--ink)}
.badge svg{position:absolute;inset:0;animation:spin 22s linear infinite}
.badge span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-style:italic;font-size:2.4rem;color:var(--rose);background:var(--card);border-radius:50%;margin:30px}
@keyframes spin{to{rotate:360deg}}
.meta-row{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:40px;padding-top:20px;border-top:1px solid color-mix(in oklab,var(--ink) 15%,transparent)}
@media (max-width:860px){.hero-grid{grid-template-columns:1fr}.hero-photo{max-width:380px}.badge{left:auto;right:-10px;bottom:-30px}}

/* Marquee */
.marquee{overflow:hidden;white-space:nowrap;border-block:1px solid color-mix(in oklab,var(--ink) 15%,transparent);padding:22px 0;background:var(--card)}
.marquee .track{display:inline-flex;gap:40px;padding-right:40px;animation:mq 46s linear infinite}
.marquee span{font-family:var(--font-display);font-style:italic;font-size:clamp(2rem,4.5vw,3.6rem);display:inline-flex;gap:40px;align-items:center}
.marquee i{font-style:normal;color:var(--rose);font-size:.55em}
@keyframes mq{to{transform:translateX(-50%)}}

/* Sections */
.sec{padding:110px 0}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:48px}
.sec-head h2{font-size:clamp(2.6rem,6vw,5rem)}
.sec-head h2 em{color:var(--rose)}
.sec-head p{max-width:42ch}

/* Intro */
.intro{display:grid;grid-template-columns:.62fr 1.38fr;gap:64px;align-items:center}
.intro .arch{aspect-ratio:3/4;box-shadow:var(--shadow-soft);max-width:400px}
.intro .arch img{width:100%;height:100%;object-fit:cover;object-position:50% 40%}
.intro-q{font-family:var(--font-display);font-size:clamp(1.6rem,3vw,2.5rem);line-height:1.2;margin-top:18px;text-wrap:pretty}
@media (max-width:860px){.intro{grid-template-columns:1fr;gap:32px}.intro .arch{max-width:340px}}
/* Competency map */
.cmap-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:28px;background:var(--card);padding:10px 18px 18px}
.cmap{border-collapse:separate;border-spacing:0;width:100%;min-width:860px;font-size:.9rem}
.cmap th,.cmap td{padding:0;text-align:center;border-bottom:1px solid color-mix(in oklab,var(--line) 70%,transparent)}
.cmap thead th{padding:14px 2px 10px;vertical-align:bottom}
.cmap thead .yh{font-family:var(--font-display);font-size:1.15rem;letter-spacing:0;text-transform:none;color:var(--ink);border-bottom:0;padding-bottom:0}
.cmap thead .yh.now{color:var(--rose)}
.cmap th.rl{text-align:left;padding:12px 12px 12px 0;font-weight:400;white-space:nowrap}
.cmap th.rl b{font-family:var(--font-mono);font-weight:400;font-size:.68rem;color:var(--muted);margin-right:10px}
.cmap td.split{border-left:1px dashed var(--line)}
.cmap tbody tr:last-child th,.cmap tbody tr:last-child td{border-bottom:0}
.cmap tbody tr:hover th.rl{color:var(--rose)}
.cmap .dot{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;margin:6px 0;text-decoration:none;transition:transform .3s var(--ease)}
.cmap .dot.e{border:1px solid color-mix(in oklab,var(--line) 90%,transparent);width:9px;height:9px}
.cmap .dot.f{background:var(--rose);color:var(--card);font-family:var(--font-mono);font-size:.72rem;box-shadow:var(--shadow-rose)}
.cmap .dot.f:hover{transform:scale(1.18)}
.cmap .now-col{background:color-mix(in oklab,var(--blush) 35%,transparent)}
.legend{display:flex;flex-wrap:wrap;gap:20px;margin-top:16px;color:var(--muted);font-size:.88rem;align-items:center}
.legend i{display:inline-block;vertical-align:middle;margin-right:8px}
/* Journey strip */
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,320px);gap:24px;overflow-x:auto;padding:6px 4px 26px;scroll-snap-type:x mandatory}
.moment{scroll-snap-align:start;text-decoration:none;display:block}
.moment .arch{aspect-ratio:3/4;box-shadow:var(--shadow-soft);background:linear-gradient(160deg,var(--sand),var(--oak))}
.moment .arch img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}
.moment:hover .arch img{transform:scale(1.05)}
.moment h4{font-size:1.9rem;margin-top:16px}
.moment p.b{color:var(--muted);margin-top:6px;font-size:.95rem}
.moment .ln{display:flex;align-items:center;gap:10px;margin-top:18px}
.moment .ln::after{content:"";flex:1;height:1px;background:color-mix(in oklab,var(--ink) 20%,transparent)}
/* Year path */
.path{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.yr{position:relative;text-decoration:none;border:1px solid var(--line);background:var(--card);border-radius:24px;padding:22px 20px 20px;display:flex;flex-direction:column;gap:18px;min-height:280px;transition:transform .6s var(--ease),box-shadow .6s var(--ease),border-color .4s}
.yr:hover{transform:translateY(-6px) rotate(-.6deg);box-shadow:var(--shadow-soft);border-color:var(--rose)}
.yr .num{font-family:var(--font-display);font-size:5rem;line-height:.8;color:var(--oak)}
.yr:hover .num,.yr.now .num{color:var(--rose)}
.yr h3{font-size:1.7rem}
.yr .sems{display:flex;gap:6px;margin-top:auto}
.yr .sems span{flex:1;border-radius:999px;border:1px solid var(--line);text-align:center;padding:6px 0;font-family:var(--font-mono);font-size:.68rem}
.yr .sems span.has{background:var(--blush);border-color:color-mix(in oklab,var(--rose) 40%,transparent);color:var(--rose-deep)}
.yr .now-tag{position:absolute;top:16px;right:16px;background:var(--rose);color:var(--card);border-radius:999px;padding:4px 10px}
.yr.now{border-color:color-mix(in oklab,var(--rose) 60%,transparent)}
@media (max-width:1060px){.path{grid-template-columns:repeat(3,1fr)}}
@media (max-width:560px){.path{grid-template-columns:repeat(2,1fr)}.yr{min-height:220px}.yr .num{font-size:3.6rem}}

/* Featured */
.feat{background:var(--ink);color:var(--ink-on);border-radius:36px;padding:clamp(28px,5vw,64px);display:grid;grid-template-columns:.8fr 1.2fr;gap:56px;align-items:center;overflow:hidden}
.feat .arch{aspect-ratio:4/5;max-width:380px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.feat .arch img{width:100%;height:100%;object-fit:cover}
.feat h3{font-size:clamp(2.4rem,5vw,4.4rem)}
.feat blockquote{margin:26px 0 0;font-family:var(--font-display);font-style:italic;font-size:1.6rem;line-height:1.25;color:var(--blush);border-left:2px solid var(--rose);padding-left:20px}
.feat p.ex{margin-top:22px;color:color-mix(in oklab,var(--ink-on) 75%,transparent);max-width:58ch}
.feat .eyebrow{color:var(--oak)}
.feat .ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}
.feat .btn-quiet{border-color:color-mix(in oklab,var(--ink-on) 30%,transparent)}
.feat .btn-quiet:hover{background:var(--ink-on);color:var(--ink)}
@media (max-width:860px){.feat{grid-template-columns:1fr}}

/* Competency index */
.cidx{position:relative;border-top:1px solid color-mix(in oklab,var(--ink) 15%,transparent)}
.crow{display:grid;grid-template-columns:3.5rem 1fr auto auto;gap:18px;align-items:center;padding:26px 0;border-bottom:1px solid color-mix(in oklab,var(--ink) 15%,transparent);text-decoration:none;cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.crow .t{font-family:var(--font-display);font-size:clamp(1.8rem,4vw,3.2rem);line-height:1;transition:all .5s var(--ease)}
.cidx.hovering .crow .t{color:color-mix(in oklab,var(--ink) 30%,transparent)}
.cidx.hovering .crow:hover .t{color:var(--ink);font-style:italic;transform:translateX(10px)}
.crow .count{font-family:var(--font-mono);font-size:.72rem;border-radius:999px;padding:6px 12px;border:1px solid color-mix(in oklab,var(--ink) 20%,transparent);color:var(--muted);white-space:nowrap}
.crow .count.has{background:var(--rose);color:var(--card);border-color:var(--rose)}
.crow svg{width:20px;height:20px;transition:transform .5s var(--ease)}
.crow:hover svg{transform:rotate(45deg);color:var(--rose)}
.crow[aria-expanded="true"] svg{transform:rotate(90deg);color:var(--rose)}
.cprev{position:absolute;left:0;top:0;width:250px;pointer-events:none;opacity:0;transition:opacity .3s;z-index:5}
.cprev.show{opacity:1}
.cprev .in{background:var(--card);padding:8px;border-radius:18px;box-shadow:var(--shadow-soft);rotate:-3deg}
.cprev .tile{aspect-ratio:4/5;border-radius:12px;background:linear-gradient(160deg,var(--sand),var(--oak));display:flex;flex-direction:column;justify-content:space-between;padding:18px}
.cprev .tile b{font-family:var(--font-display);font-style:italic;font-weight:400;font-size:4.4rem;color:var(--rose-deep);line-height:1}
.cprev .tile img{position:absolute}
.cprev p{font-size:.85rem;line-height:1.4;color:var(--muted);padding:10px 6px 4px}
@media (max-width:1000px){.cprev{display:none}}
@media (max-width:600px){.crow{grid-template-columns:2.4rem 1fr auto}.crow .count{display:none}}
.cdrop{padding:6px 0 28px 0;display:none}
.cdrop.open{display:block}
.cdrop p.sum{max-width:62ch;color:var(--muted);margin-bottom:16px}

/* Page headers */
.phead{padding:140px 0 50px}
.crumbs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:26px;color:var(--muted)}
.crumbs a{text-decoration:none}
.crumbs a:hover{color:var(--rose)}
.phead h1{font-size:clamp(3.4rem,10vw,8.4rem);line-height:.88}
.phead h1 em{color:var(--rose)}
.phead .sub{margin-top:22px;font-size:1.15rem;max-width:56ch;color:color-mix(in oklab,var(--ink) 80%,transparent)}

/* Semester doors */
.doors{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.door{text-decoration:none;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:999px 999px 28px 28px;padding:70px clamp(22px,4vw,48px) 36px;min-height:460px;position:relative;overflow:hidden;transition:transform .7s var(--ease),box-shadow .7s var(--ease),border-color .4s}
.door:hover{transform:translateY(-6px);box-shadow:var(--shadow-soft);border-color:var(--rose)}
.door .big{font-family:var(--font-display);font-size:clamp(6rem,14vw,11rem);line-height:.8;color:var(--oak);text-align:center;transition:color .4s}
.door:hover .big{color:var(--rose)}
.door h2{font-size:2.4rem;text-align:center;margin-top:10px}
.door .stats{display:flex;justify-content:center;gap:24px;margin-top:16px;color:var(--muted)}
.door ul{list-style:none;padding:0;margin:26px 0 0;display:grid;gap:8px}
.door li{border-top:1px solid var(--line);padding-top:8px;display:flex;justify-content:space-between;gap:12px;font-size:.95rem}
.door .go{margin-top:auto;padding-top:24px;display:flex;justify-content:center}
@media (max-width:760px){.doors{grid-template-columns:1fr}.door{min-height:380px}}

/* Coverage dots */
.cov{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:20px}
.cov span{font-family:var(--font-mono);font-size:.62rem;letter-spacing:.08em;border:1px solid var(--line);border-radius:999px;padding:4px 8px;color:var(--muted)}
.cov span.on{background:var(--rose);border-color:var(--rose);color:var(--card)}

/* Semester page */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:34px}
.chip{border:1px solid color-mix(in oklab,var(--ink) 20%,transparent);background:none;border-radius:999px;padding:8px 14px;cursor:pointer;font-size:.85rem;transition:all .3s;display:inline-flex;gap:8px;align-items:center}
.chip:hover{border-color:var(--rose);color:var(--rose)}
.chip.on{background:var(--ink);color:var(--ink-on);border-color:var(--ink)}
.chip .n{font-family:var(--font-mono);font-size:.7rem;opacity:.7}
.chip.empty{opacity:.45}
.elist{display:grid;gap:22px}
.ecard{display:grid;grid-template-columns:240px 1fr auto;gap:30px;align-items:center;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:16px 28px 16px 16px;transition:transform .6s var(--ease),box-shadow .6s var(--ease),border-color .4s}
.ecard:hover{transform:translateY(-4px);box-shadow:var(--shadow-soft);border-color:var(--rose)}
.ecard .th{aspect-ratio:4/3;border-radius:18px;overflow:hidden;background:linear-gradient(160deg,var(--sand),var(--oak));display:grid;place-items:center}
.ecard .th img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}
.ecard:hover .th img{transform:scale(1.05)}
.ecard .th b{font-family:var(--font-display);font-style:italic;font-weight:400;font-size:3.4rem;color:var(--rose-deep)}
.ecard h3{font-size:clamp(1.8rem,3vw,2.6rem);margin:8px 0 10px}
.ecard .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tag{font-family:var(--font-mono);font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;border-radius:999px;padding:5px 10px;border:1px solid var(--line);color:var(--muted)}

.edit-toggle{position:fixed;left:18px;bottom:18px;z-index:80;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--ink-on);border-radius:999px;padding:10px 16px 10px 12px;border:0;cursor:pointer;box-shadow:var(--shadow-soft)}

.edit-toggle.on .sw{background:var(--rose)}
.edit-toggle.on .sw::after{left:17px}
.form{display:grid;gap:18px;margin-top:18px}
.form .row{display:grid;grid-template-columns:1fr 1fr;gap:16px}

.form label{display:grid;gap:6px;font-size:.9rem;font-weight:500}
.form label small{font-weight:400;color:var(--muted)}
.form input[type=text],.form select,.form textarea{font:inherit;font-size:1rem;border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:var(--paper);color:var(--ink);width:100%}
.form textarea{min-height:110px;resize:vertical;line-height:1.5}
.form input:focus,.form select:focus,.form textarea:focus{outline:2px solid var(--rose);outline-offset:0;border-color:transparent}
.form fieldset{border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:14px;margin:0}
.form legend{padding:0 8px;font-family:var(--font-mono);font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--rose)}
.check{display:flex!important;grid-template-columns:none;align-items:center;gap:10px!important;font-weight:400!important}
.check input{width:18px;height:18px;accent-color:var(--rose)}
.evrow{display:grid;grid-template-columns:84px 1fr auto;gap:14px;align-items:start;border-top:1px solid var(--line);padding-top:14px}
.evrow .mini{width:84px;height:64px;border-radius:10px;overflow:hidden;background:var(--sand);display:grid;place-items:center;font-family:var(--font-display);font-style:italic;color:var(--rose-deep)}
.evrow .mini img{width:100%;height:100%;object-fit:cover}
.evrow .f{display:grid;gap:8px}
.evrow .rm{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.8rem}
.evrow .rm:hover{border-color:var(--rose);color:var(--rose)}
.drop{border:1.5px dashed color-mix(in oklab,var(--ink) 30%,transparent);border-radius:16px;padding:22px;text-align:center;cursor:pointer;transition:all .3s}
.drop:hover,.drop.over{border-color:var(--rose);background:color-mix(in oklab,var(--blush) 50%,transparent)}
.drop input{display:none}
.status{font-size:.88rem;color:var(--muted)}
.status.err{color:oklch(0.5 0.2 27)}
.form-acts{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;position:sticky;bottom:-32px;background:var(--card);padding:16px 0 4px;border-top:1px solid var(--line)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  html{scroll-behavior:auto}
}

  h+='</tr><tr><th class="rl eyebrow muted" style="padding-top:2px">Competency</th>'+cols.map(function(c){return '<th class="eyebrow muted'+(c.s===1?' split':'')+(c.y===CURRENT_YEAR?' now-col':'')+'" style="font-size:.6rem;padding:6px 2px">S'+c.s+'</th>';}).join("")+'</tr></thead><tbody>';
  COMPS.forEach(function(c){

      h+='<td class="'+(col.s===1?'split':'')+(col.y===CURRENT_YEAR?' now-col':'')+'">'+(list.length?'<a class="dot f" href="'+(list.length===1?'#entry-'+esc(list[0].id):'#year-'+col.y+'-sem-'+col.s)+'" title="'+esc(list.map(function(e){return e.title;}).join(' · '))+'" data-cursor="Open">'+list.length+'</a>':'<span class="dot e" aria-hidden="true"></span>')+'</td>';

/* ---------- Gibbs wheel ---------- */
function gibbs(mount,g){
  var stages=STAGES.filter(function(st){return (g[st]||[]).length;});
  var n=stages.length, active=0, linear=false, R=42;
  function draw(){
    if(linear){
      mount.innerHTML='<div style="display:flex;justify-content:flex-end;margin-bottom:28px"><button class="btn btn-quiet btn-sm" id="gCyc">View as interactive cycle</button></div><ol class="linear" style="list-style:none;padding:0;margin:0">'+
        stages.map(function(st,i){return '<li><div><p class="eyebrow rose">Stage '+pad(i+1)+'</p><h3>'+st+'</h3><p class="muted" style="font-style:italic;font-size:.92rem;margin-top:4px">'+PROMPTS[st]+'</p></div><div class="prose" style="max-width:none">'+g[st].map(function(p){return '<p style="font-size:1.08rem">'+esc(p)+'</p>';}).join("")+'</div></li>';}).join("")+'</ol>';
      mount.querySelectorAll(".prose p:first-child").forEach(function(p){p.classList.add("nodrop");});
      document.getElementById("gCyc").onclick=function(){linear=false;draw();};
      return;
    }
    var st=stages[active];
    var nodes=stages.map(function(s2,i){var a=(-90+360/n*i)*Math.PI/180;var x=50+R*Math.cos(a),y=50+R*Math.sin(a);return '<button class="node'+(i===active?' on':(i<active?' done':''))+'" data-i="'+i+'" style="left:'+x+'%;top:'+y+'%" aria-pressed="'+(i===active)+'" aria-label="Stage '+(i+1)+': '+s2+'"><i>'+pad(i+1)+'</i><span>'+s2+'</span></button>';}).join("");
    mount.innerHTML='<div class="gibbs" tabindex="0" id="gWrap"><div class="wheel"><svg class="ring" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="'+R+'" fill="none" stroke="var(--line)" stroke-width=".4"/><circle cx="50" cy="50" r="'+R+'" fill="none" stroke="var(--rose)" stroke-width=".9" stroke-linecap="round" pathLength="100" stroke-dasharray="'+((active+1)/n*100)+' 100" style="transition:stroke-dasharray .7s var(--ease)"/></svg>'+
      '<div class="core"><span class="eyebrow muted">Gibbs · '+pad(active+1)+'/'+pad(n)+'</span><b>'+st+'</b><small>'+PROMPTS[st]+'</small></div>'+nodes+'</div>'+
      '<div class="gpanel"><div class="fade"><p class="eyebrow rose">Stage '+pad(active+1)+'</p><h3>'+st+'</h3><p class="q">'+PROMPTS[st]+'</p><div class="txt">'+g[st].map(function(p){return '<p>'+esc(p)+'</p>';}).join("")+'</div></div>'+
      '<div class="ctl"><button class="btn btn-quiet btn-sm" id="gPrev" aria-label="Previous stage">'+ICON.left+'</button><button class="btn btn-ink btn-sm" id="gNext">'+(active===n-1?'Back to '+stages[0]:'Next: '+stages[(active+1)%n])+' '+ICON.right+'</button><button class="lin eyebrow link-u" id="gLin">Read all '+n+' stages</button></div></div></div>';
    mount.querySelectorAll(".node").forEach(function(b){b.onclick=function(){active=+b.dataset.i;draw();};});
    document.getElementById("gPrev").onclick=function(){active=(active-1+n)%n;draw();};
    document.getElementById("gNext").onclick=function(){active=(active+1)%n;draw();};
    document.getElementById("gLin").onclick=function(){linear=true;draw();};
    document.getElementById("gWrap").onkeydown=function(ev){if(ev.key==="ArrowRight"){active=(active+1)%n;draw();document.getElementById("gWrap").focus();}if(ev.key==="ArrowLeft"){active=(active-1+n)%n;draw();document.getElementById("gWrap").focus();}};
  }
  draw();
}

function shrink(file){
  return new Promise(function(res){
    if(/gif|svg/.test(file.type)||file.size<350000){res(file);return;}
    var url=URL.createObjectURL(file), img=new Image();
    img.onload=function(){
      var max=2000, w=img.naturalWidth, h=img.naturalHeight, k=Math.min(1,max/Math.max(w,h));
      var c=document.createElement("canvas"); c.width=Math.round(w*k); c.height=Math.round(h*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      c.toBlob(function(b){URL.revokeObjectURL(url);res(b&&b.size<file.size?b:file);},"image/jpeg",0.86);
    };
    img.onerror=function(){URL.revokeObjectURL(url);res(file);};
    img.src=url;
  });
}
var pdfjsP=null;
function loadPdfjs(){
  if(pdfjsP) return pdfjsP;
  pdfjsP=new Promise(function(res,rej){
    var s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    s.onload=function(){try{window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";}catch(e){} res(window.pdfjsLib);};
    s.onerror=function(){rej(new Error("pdf preview unavailable"));};
    document.head.appendChild(s);
  });
  return pdfjsP;
}
function pdfThumb(file){
  return loadPdfjs().then(function(lib){return file.arrayBuffer().then(function(buf){return lib.getDocument({data:buf}).promise;});})
    .then(function(doc){return doc.getPage(1);})
    .then(function(page){var v=page.getViewport({scale:1});var k=1400/Math.max(v.width,v.height);var vp=page.getViewport({scale:k});var c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;var ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);return page.render({canvasContext:ctx,viewport:vp}).promise.then(function(){return new Promise(function(r){c.toBlob(r,"image/jpeg",0.85);});});});
}
function uploadPdf(file){
  var up=EDIT.assets.upload(file);
  var th=Promise.race([pdfThumb(file),new Promise(function(_,rej){setTimeout(function(){rej(new Error("timeout"));},15000);})])
    .then(function(b){return b?EDIT.assets.upload(b):null;}).catch(function(){return null;});
  return Promise.all([up,th]).then(function(r){return {file:r[0].url,image:r[1]?r[1].url:null};});
}

/* ---------- Publishing (the page saves itself) ---------- */
function buildDoc(state){
  var json=JSON.stringify(state).replace(/</g,"\\u003c").replace(/-->/g,"--\\u003e");
  var head=document.head.querySelectorAll("meta,title,link");
  var headHtml="";
  head.forEach(function(n){ if(n.tagName==="LINK" && !/fonts\.g/.test(n.href||"")) return; if(n.tagName==="META" && !n.hasAttribute("charset") && n.getAttribute("name")!=="viewport") return; headHtml+=n.outerHTML+"\n"; });
  return '<!DOCTYPE html>\n<html lang="en">\n<head>\n'+headHtml+document.getElementById("app-style").outerHTML+'\n</head>\n<body>\n<div id="app"></div>\n<script id="state" type="application/json">'+json+'<\/script>\n<script id="app-src">'+document.getElementById("app-src").textContent+'<\/script>\n</body>\n</html>\n';
}
function save(next,hash){
  if(!EDIT.artifact) return Promise.reject(new Error("Saving isn't available in this view. Open the portfolio on claude.ai while signed in."));
  var html=buildDoc(next);
  try{ if(hash) history.replaceState(null,"",hash); }catch(e){}
  return EDIT.artifact.publish(html).then(function(){
    STATE=next; toast("Saved. The portfolio is updated.");
    document.querySelectorAll(".dlg").forEach(function(d){d.remove();});
    if(hash && location.hash!==hash) location.hash=hash; else render(true);
  }).catch(function(err){
    var c=(err&&(err.code||err.name||err.message))||"";
    if(/conflict/i.test(c)) throw new Error("Someone else saved at the same time. The page will reload; please try again.");
    if(/not_granted|not_writer/i.test(c)) throw new Error("You don't have permission to edit this portfolio.");
    throw new Error("Couldn't save: "+((err&&err.message)||"please try again")+".");
  });
}

/* ---------- Cursor ---------- */
(function(){
  if(!window.matchMedia("(pointer: fine)").matches || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var el=document.createElement("div"); el.className="cur"; el.setAttribute("aria-hidden","true"); el.innerHTML="<div><span></span></div>";
  document.body.appendChild(el);
  var x=innerWidth/2,y=innerHeight/2,cx=x,cy=y,span=el.querySelector("span");
  addEventListener("pointermove",function(e){x=e.clientX;y=e.clientY;var t=e.target&&e.target.closest?e.target.closest("a,button,[data-cursor],label.drop"):null;var lab=t&&t.dataset?t.dataset.cursor:null;el.classList.toggle("hov",!!t&&!lab);el.classList.toggle("lab",!!lab);span.textContent=lab||"";});
  (function loop(){cx+=(x-cx)*.18;cy+=(y-cy)*.18;el.style.transform="translate3d("+cx+"px,"+cy+"px,0)";requestAnimationFrame(loop);})();
})();

/* ---------- Boot ---------- */
function slug(t){return String(t||"activity").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,60)||"activity";}
function fromFiles(site,acts,moms){
  var used={};
  var GK={"Description":"description","Feelings":"feelings","Evaluation":"evaluation","Analysis":"analysis","Conclusion":"conclusion","Action Plan":"action_plan"};
  var entries=(Array.isArray(acts)?acts:[]).filter(function(a){return a&&a.title;}).map(function(a){
    var id=slug(a.title); while(used[id]) id+="-2"; used[id]=1;
    var g=null, gg=a.gibbs||{};
    STAGES.forEach(function(st){var v=paras(gg[GK[st]]); if(v.length){g=g||{}; g[st]=v;}});
    return {id:id,year:+a.year||1,sem:+a.semester||1,competency:a.competency||COMPS[0].slug,title:a.title,date:a.date||"",location:a.location||"",role:a.role||"",
      featured:!!a.featured,takeaway:a.takeaway||"",cover:a.cover||null,activity:paras(a.description),gibbs:g,
      evidence:(a.evidence||[]).filter(function(v){return v&&(v.image||v.file);}).map(function(v){return {title:v.title||"Evidence",issuer:v.issuer||"",date:v.date||"",note:v.note||"",image:v.image||null,file:v.file||null};})};
  });
  var journey=(Array.isArray(moms)?moms:[]).filter(function(m){return m&&m.title;}).map(function(m){
    var link=null; if(m.activity){var e=entries.filter(function(x){return x.title===m.activity;})[0]; if(e) link="#entry-"+e.id;}
    return {year:+m.year||1,date:m.date||"",title:m.title,body:m.text||"",image:m.image||null,link:link};
  });
  site=site||{};
  return {entries:entries,journey:journey,photos:{hero:site.homepage_photo||null,coat:site.intro_photo||null,portrait:site.about_photo||null}};
}
if(STATE.load==="files"){
  app.innerHTML='<p class="eyebrow muted" style="padding:45vh 0;text-align:center">Loading portfolio…</p>';
  var get=function(p){return fetch(p,{cache:"no-cache"}).then(function(r){if(!r.ok) throw new Error(p+" "+r.status); return r.json();});};
  Promise.all([get("content/site.json"),get("content/activities.json"),get("content/moments.json").catch(function(){return [];})])
    .then(function(r){STATE=fromFiles(r[0],r[1],r[2]); PH=STATE.photos; render();})
    .catch(function(err){app.innerHTML='<p style="padding:40vh 24px;text-align:center">The portfolio content couldn\'t load ('+esc(err.message)+'). Check that the content folder is in the repository.</p>';});
} else render();
function boot(tries){
  if(!(window.claude && typeof window.claude.use==="function")){ if(tries<20) setTimeout(function(){boot(tries+1);},250); return; }
  Promise.all([claude.use("artifact"),claude.use("assets"),claude.use("user")]).then(function(r){
    EDIT.artifact=r[0]; EDIT.assets=r[1];
    var user=r[2];
    var p = user && user.canEdit ? Promise.resolve(user.canEdit()).catch(function(){return false;}) : Promise.resolve(!!r[0]);
    return p.then(function(ok){ EDIT.can=!!(ok && r[0]); if(EDIT.can) render(true); });
  }).catch(function(){});
}
boot(0);
})();
</script>
